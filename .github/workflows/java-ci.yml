name: Compile Java and Push to QA Branch

on:
  push:
    branches:
    - java_generated_v2

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    environment: qa # 🔐 REQUIRED to access environment secrets

    steps:
    # -------------------------------
    # Checkout Code
    # -------------------------------
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # -------------------------------
    # Setup Java
    # -------------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # -------------------------------
    # Compile ALL Java Files
    # -------------------------------
    - name: Compile Java files
      run: |
        set -e
        mkdir -p out

        echo "Finding Java source files..."
        find . -name "*.java" > sources.txt

        if [ ! -s sources.txt ]; then
          echo "❌ No Java files found!"
          exit 1
        fi

        echo "Compiling..."
        javac -d out @sources.txt 2> compile-error.log

    # -------------------------------
    # Push SOURCE + CLASS files
    # -------------------------------
    - name: Push compiled code to qa_validation_v1
      if: success()
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git fetch origin

        # Prepare safe temp storage
        mkdir -p /tmp/build/src /tmp/build/bin

        # Copy source and class files with structure
        find . -name "*.java" -exec cp --parents {} /tmp/build/src/ \;
        find out -name "*.class" -exec cp --parents {} /tmp/build/bin/ \;

        # Switch to QA branch
        if git show-ref --verify --quiet refs/remotes/origin/qa_validation_v1; then
          git checkout -B qa_validation_v1 origin/qa_validation_v1
        else
          git checkout -b qa_validation_v1
        fi

        # Restore files
        cp -r /tmp/build/src/* .
        cp -r /tmp/build/bin/* .

        git add -A
        git commit -m "Auto-compiled Java source and class files" || echo "Nothing to commit"
        git push origin qa_validation_v1

    # -------------------------------
    # Email on FAILURE
    # -------------------------------
    - name: Send failure email to developer
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        secure: false
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        to: ${{ secrets.ALERT_EMAIL }}
        from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
        subject: "❌ Java CI Build Failed – gitops-mlops"
        body: |
          Hello Team,

          ❌ Java compilation FAILED.

          Repository: gitops-mlops
          Branch: java_generated_v2

          🔎 Compilation Error Log:
          ----------------------------------
          $(cat compile-error.log)
          ----------------------------------

          Please fix the issue and push again.

          – GitHub Actions CI
