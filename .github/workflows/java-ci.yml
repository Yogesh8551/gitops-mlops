name: Compile Java and Push to QA Branch

on:
  push:
    branches:
    - java_generated_v2

permissions:
  contents: write # REQUIRED to push from GitHub Actions

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # IMPORTANT: fetch all branches

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Compile Java files
      run: |
        mkdir -p out
        javac -d out HelloWorld.java

    - name: Push compiled code to qa_validation_v1
      if: success()
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git fetch origin

        # Checkout QA branch (create if missing)
        if git show-ref --verify --quiet refs/remotes/origin/qa_validation_v1; then
          git checkout -B qa_validation_v1 origin/qa_validation_v1
        else
          git checkout -b qa_validation_v2
        fi

        cp out/*.class .
        git add .
        git commit -m "Auto-compiled Java classes" || echo "Nothing to commit"
        git push origin qa_validation_v1
      # -------------------------------
      # Send EMAIL if compile FAILS
      # -------------------------------
    - name: Send failure email to developer
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        secure: false
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}

        subject: "❌ Java CI Build Failed – gitops-mlops"
        to: ${{ secrets.ALERT_EMAIL }}
        from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"

        body: |
          Hello Team,

          ❌ Java compilation FAILED in GitHub Actions.

          Repository: gitops-mlops
          Branch: java_generated_v2
          Workflow: Compile Java and Push to QA Branch

          🔎 Error details:
          ----------------------------------
          $(cat compile-error.log)
          ----------------------------------

          Please fix the issue and push again.

          – GitHub Actions CI  
