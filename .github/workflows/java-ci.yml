name: Compile Java and Push to QA Branch

on:
  push:
    branches:
    - java_generated_v2

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # --------------------------------
    # Compile Java (capture logs)
    # --------------------------------
    - name: Compile Java files
      id: compile
      run: |
        mkdir -p out
        javac -d out HelloWorld.java 2> compile-error.log

    # --------------------------------
    # Push ONLY if compilation succeeds
    # --------------------------------
    - name: Push compiled code to qa_validation_v1
      if: success()
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git fetch origin

        # IMPORTANT: clean build output before checkout
        rm -rf out

        # Checkout QA branch safely
        if git show-ref --verify --quiet refs/remotes/origin/qa_validation_v1; then
          git checkout -B qa_validation_v1 origin/qa_validation_v1
        else
          git checkout -b qa_validation_v2
        fi

        cp out/*.class .
        git add .
        git commit -m "Auto-compiled Java classes" || echo "Nothing to commit"
        git push origin qa_validation_v1

    # --------------------------------
    # Email notification on FAILURE
    # --------------------------------
    - name: Send failure email to developer
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: yogeshwar8551@gmail.com
        server_port: 587
        secure: false
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        to: ${{ secrets.ALERT_EMAIL }}
        from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
        subject: "❌ Java CI Build Failed – gitops-mlops"
        body: |
          Hello Team,

          ❌ Java compilation FAILED.

          Repository: gitops-mlops
          Branch: java_generated_v2
          Workflow: Compile Java and Push to QA Branch

          🔎 Error details:
          ----------------------------------
          $(cat compile-error.log)
          ----------------------------------

          Please fix the issue and push again.

          – GitHub Actions CI
