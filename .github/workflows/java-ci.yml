name: Compile Java and Push to Release Branch

on:
  push:
    branches:
    - java_generated_v2

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Compile Java files
      run: |
        mkdir -p out
        javac -d out HelloWorld.java

    - name: Push compiled code to compiled_release_v1
      run: |
        git config user.name "yogesh8551"
        git config user.email "yogeshwar8551@gmail.com"

        git checkout qa_validation_v1
        cp -r out/*.class .
        git add .
        git commit -m "Auto-compiled Java classes"
        git push origin qa_validation_v1
