name: Compile Java and Push to QA Branch

on:
  push:
    branches:
    - java_generated_v2

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # -------------------------------
    # Compile ALL Java files
    # -------------------------------
    - name: Compile Java files
      run: |
        mkdir -p out
        find . -name "*.java" > sources.txt
        javac -d out @sources.txt 2> compile-error.log

    # -------------------------------
    # Push source + compiled files
    # -------------------------------
    - name: Push compiled code to qa_validation_v1
      if: success()
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git fetch origin

        # Save files safely
        mkdir -p /tmp/build/java /tmp/build/class
        find . -name "*.java" -exec cp --parents {} /tmp/build/java/ \;
        find out -name "*.class" -exec cp --parents {} /tmp/build/class/ \;

        # Clean workspace
        rm -rf out compile-error.log sources.txt

        # Checkout QA branch
        git checkout -B qa_validation_v1 origin/qa_validation_v1

        # Restore files
        cp -r /tmp/build/java/* .
        cp -r /tmp/build/class/* .

        # SAFE ADD (no globbing)
        git add -A
        git commit -m "Auto-compiled Java source and class files" || echo "Nothing to commit"
        git push origin qa_validation_v1

    # -------------------------------
    # Email on FAILURE
    # -------------------------------
    - name: Send failure email to developer
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        secure: false
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        to: ${{ secrets.ALERT_EMAIL }}
        from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
        subject: "❌ Java CI Build Failed – gitops-mlops"
        body: |
          Hello Team,

          ❌ Java compilation FAILED.

          Repository: gitops-mlops
          Branch: java_generated_v2

          🔎 Error log:
          ----------------------------------
          $(cat compile-error.log)
          ----------------------------------

          – GitHub Actions CI
